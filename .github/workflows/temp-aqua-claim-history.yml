name: Temporary Aqua claim history

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aqua-claim-history.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate recent SwapVM fills
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'web3>=7,<8'
          python3 - <<'PY'
          from web3 import Web3
          from hexbytes import HexBytes
          from decimal import Decimal, getcontext
          from datetime import datetime, timezone, timedelta
          import time
          getcontext().prec=80
          TARGET='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          ROUTER='0x111111338c5091e8440b67b168bae16a668ac0de'
          META={
            '0x111111111117dc0aa78b770fa6a738034120c302':('1INCH',18),
            '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48':('USDC',6),
            '0xdac17f958d2ee523a2206206994597c13d831ec7':('USDT',6),
            '0x6b175474e89094c44da98b954eedeac495271d0f':('DAI',18),
            '0x6c3ea9036406852006290770bedfcaba0e23a0e8':('PYUSD',6),
            '0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0':('wstETH',18),
            '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2':('WETH',18),
            '0xae7ab96520de3a18e5e111b5eaab095312d7fe84':('stETH',18),
            '0xbe9895146f7af43049ca1c1ae358b0541ea49704':('cbETH',18),
            '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599':('WBTC',8),
            '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984':('UNI',18),
            '0x5a98fcbea516cf06857215779fd812ca3bef1b32':('LDO',18),
          }
          ERC20=[{'type':'function','name':'symbol','stateMutability':'view','inputs':[],'outputs':[{'type':'string'}]},{'type':'function','name':'decimals','stateMutability':'view','inputs':[],'outputs':[{'type':'uint8'}]}]
          providers=[]
          for rpc in ['https://eth.llamarpc.com','https://1rpc.io/eth','https://ethereum-rpc.publicnode.com']:
            try:
              c=Web3(Web3.HTTPProvider(rpc,request_kwargs={'timeout':90})); latest=c.eth.block_number
              # Confirm eth_getLogs is enabled before selecting it.
              _=c.eth.get_logs({'fromBlock':latest-10,'toBlock':latest,'address':Web3.to_checksum_address(ROUTER)})
              providers.append((rpc,c,latest)); print('LOG_RPC_OK|%s|latest=%s' % (rpc,latest))
            except Exception as exc: print('LOG_RPC_FAIL|%s|%r' % (rpc,exc))
          if not providers: raise SystemExit('no log-capable RPC')
          rpc,w3,latest=providers[0]
          cache={}
          def meta(addr):
            addr=addr.lower()
            if addr in META:return META[addr]
            sym=addr[:10];dec=18
            try:
              c=w3.eth.contract(address=Web3.to_checksum_address(addr),abi=ERC20);sym=c.functions.symbol().call();dec=int(c.functions.decimals().call())
            except Exception:pass
            META[addr]=(sym,dec);return sym,dec
          def ts(block):
            if block not in cache:cache[block]=int(w3.eth.get_block(block)['timestamp'])
            return cache[block]
          def jst(stamp):return datetime.fromtimestamp(stamp,timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST')
          def H(raw,dec):return Decimal(raw)/(Decimal(10)**dec)
          topic=Web3.keccak(text='Swapped(bytes32,address,address,address,address,uint256,uint256)').hex()
          rawlogs=[]
          for a in range(25713000,latest+1,250):
            b=min(latest,a+249); ok=False
            for attempt in range(4):
              try:
                rawlogs.extend(w3.eth.get_logs({'fromBlock':a,'toBlock':b,'address':Web3.to_checksum_address(ROUTER),'topics':[topic]}));ok=True;break
              except Exception as exc:
                print('CHUNK_RETRY|%s|%s|attempt=%s|%r' % (a,b,attempt+1,exc));time.sleep(1+attempt)
            if not ok:print('CHUNK_SKIP|%s|%s' % (a,b))
          fills=[]
          for log in rawlogs:
            v=w3.codec.decode(['bytes32','address','address','address','address','uint256','uint256'],HexBytes(log['data']))
            if v[1].lower()!=TARGET:continue
            ti=v[3].lower();to=v[4].lower();si,di=meta(ti);so,do=meta(to);stamp=ts(int(log['blockNumber']))
            fills.append({'ts':stamp,'tx':log['transactionHash'].hex(),'strategy':'0x'+v[0].hex(),'sin':si,'ain':H(v[5],di),'sout':so,'aout':H(v[6],do)})
          fills.sort(key=lambda x:x['ts']);agg={}
          for f in fills:
            k=(f['strategy'],f['sin'],f['sout']);g=agg.setdefault(k,[0,Decimal(0),Decimal(0),f['ts'],f['ts']]);g[0]+=1;g[1]+=f['ain'];g[2]+=f['aout'];g[3]=min(g[3],f['ts']);g[4]=max(g[4],f['ts'])
          print('FILL_TOTAL|count=%s|strategy_directions=%s|first=%s|last=%s' % (len(fills),len(agg),jst(fills[0]['ts']) if fills else None,jst(fills[-1]['ts']) if fills else None))
          for (strategy,si,so),g in sorted(agg.items(),key=lambda z:(z[1][4],z[0])):print('FILL_GROUP|pair=%s->%s|count=%s|amount_in=%s|amount_out=%s|first=%s|last=%s|strategy=%s' % (si,so,g[0],g[1],g[2],jst(g[3]),jst(g[4]),strategy))
          for f in fills[-40:]:print('FILL|jst=%s|pair=%s->%s|amount_in=%s|amount_out=%s|strategy=%s|tx=%s' % (jst(f['ts']),f['sin'],f['sout'],f['ain'],f['aout'],f['strategy'],f['tx']))
          PY
