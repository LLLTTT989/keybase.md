name: Temporary decode two Aqua ranges

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aqua-ranges-two.yml"

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch encoded orders
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'web3>=7,<8'
          python3 - <<'PY'
          import json
          from web3 import Web3
          from hexbytes import HexBytes
          from decimal import Decimal
          TXS=[
            '0xd3f78f29098c2ba400898c4305f2664b90121722591dbbc2a3cf25350ce9343c',
            '0x5aabf1fdf4223523c6d84efede0e1ddbae5e374c8a94624e56507b65b8121f5e',
          ]
          META={
            '0x111111111117dc0aa78b770fa6a738034120c302':('1INCH',18),
            '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2':('WETH',18),
            '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599':('WBTC',8),
          }
          ABI=[{'type':'function','name':'ship','stateMutability':'nonpayable','inputs':[{'name':'app','type':'address'},{'name':'strategy','type':'bytes'},{'name':'tokens','type':'address[]'},{'name':'amounts','type':'uint256[]'}],'outputs':[{'type':'bytes32'}]}]
          w3=None
          for rpc in ['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth']:
            try:
              c=Web3(Web3.HTTPProvider(rpc,request_kwargs={'timeout':60}));_=c.eth.block_number;w3=c;print('RPC|%s|latest=%s'%(rpc,c.eth.block_number));break
            except Exception as e:print('RPC_FAIL|%s|%r'%(rpc,e))
          if w3 is None:raise SystemExit('no rpc')
          contract=w3.eth.contract(address=Web3.to_checksum_address('0x1111113ccf1426a8e30e2bff5e005d929bf6a90a'),abi=ABI)
          rows=[]
          for h in TXS:
            tx=w3.eth.get_transaction(h);fn,a=contract.decode_function_input(tx['input']);tokens=[]
            for t,raw in zip(a['tokens'],a['amounts']):
              addr=t.lower();sym,dec=META[addr];tokens.append({'address':addr,'symbol':sym,'decimals':dec,'amount':str(Decimal(int(raw))/(Decimal(10)**dec))})
            row={'tx':h,'app':a['app'].lower(),'encodedOrder':'0x'+HexBytes(a['strategy']).hex().removeprefix('0x'),'tokens':tokens}
            rows.append(row);print('SHIP|tx=%s|pair=%s|amounts=%s|bytes=%s'%(h,'/'.join(x['symbol'] for x in tokens),','.join('%s=%s'%(x['symbol'],x['amount']) for x in tokens),len(HexBytes(a['strategy']))))
          with open('/tmp/orders.json','w') as f:json.dump(rows,f)
          PY
      - name: Decode official SDK ranges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk && cd /tmp/sdk
          npm init -y >/dev/null 2>&1
          npm install --silent @1inch/swap-vm-sdk decimal.js
          cat > decode.mjs <<'JS'
          import fs from 'fs'
          import Decimal from 'decimal.js'
          import { Order, HexString, AquaProgramBuilder } from '@1inch/swap-vm-sdk'

          const rows = JSON.parse(fs.readFileSync('/tmp/orders.json', 'utf8'))
          const fmt = (d) => d.toSignificantDigits(24).toString()

          for (const row of rows) {
            try {
              const order = Order.decode(new HexString(row.encodedOrder))
              const instructions = AquaProgramBuilder.decode(order.program).getInstructions()
              let range = null
              const decodedInstructions = []

              for (const ix of instructions) {
                const args = typeof ix.args?.toJSON === 'function' ? ix.args.toJSON() : {}
                const type = ix.args?.constructor?.name || null
                decodedInstructions.push({ opcode: String(ix.opcode?.id), type, args })

                if (args.sqrtPriceMin !== undefined && args.sqrtPriceMax !== undefined) {
                  const rawMin = new Decimal(args.sqrtPriceMin).pow(2).div('1e18')
                  const rawMax = new Decimal(args.sqrtPriceMax).pow(2).div('1e18')
                  const sorted = [...row.tokens].sort((a, b) => BigInt(a.address) < BigInt(b.address) ? -1 : 1)
                  const tokenLt = sorted[0]
                  const tokenGt = sorted[1]
                  const scale = new Decimal(10).pow(18 + tokenGt.decimals - tokenLt.decimals)
                  const directMin = rawMin.div(scale)
                  const directMax = rawMax.div(scale)
                  range = {
                    directPair: `${tokenGt.symbol} per ${tokenLt.symbol}`,
                    directMin: fmt(directMin),
                    directMax: fmt(directMax),
                    inversePair: `${tokenLt.symbol} per ${tokenGt.symbol}`,
                    inverseMin: fmt(new Decimal(1).div(directMax)),
                    inverseMax: fmt(new Decimal(1).div(directMin)),
                    sqrtPriceMin: String(args.sqrtPriceMin),
                    sqrtPriceMax: String(args.sqrtPriceMax),
                    rawPriceMin: rawMin.toFixed(0),
                    rawPriceMax: rawMax.toFixed(0),
                  }
                }
              }

              console.log('RANGE|tx=%s|pair=%s|maker=%s|amounts=%s|range=%s|instructions=%s',
                row.tx,
                row.tokens.map(t => t.symbol).join('/'),
                order.maker.toString(),
                row.tokens.map(t => `${t.symbol}=${t.amount}`).join(','),
                JSON.stringify(range),
                JSON.stringify(decodedInstructions),
              )
            } catch (error) {
              console.log('DECODE_FAIL|tx=%s|error=%s', row.tx, error?.stack || String(error))
            }
          }
          JS
          node decode.mjs
