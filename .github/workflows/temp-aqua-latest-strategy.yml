name: Temporary Aqua latest strategy

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aqua-latest-strategy.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current Aqua virtual balances
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'web3>=7,<8'
          python3 - <<'PY'
          from web3 import Web3
          from decimal import Decimal, getcontext
          getcontext().prec=80

          TARGET='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          AQUA='0x1111113ccf1426a8e30e2bff5e005d929bf6a90a'
          APP='0x111111338c5091e8440b67b168bae16a668ac0de'
          STRATEGY='0x89a88977c8083e859c7e680286f7a3b6f7a0e6fd27a038dcaeeaada4987494e4'
          TOKENS=[
            ('1INCH','0x111111111117dc0aa78b770fa6a738034120c302',18),
            ('SPYx','0x90a2a4c76b5d8c0bc892a69ea28aa775a8f2dd48',18),
          ]
          ABI=[
            {'type':'function','name':'rawBalances','stateMutability':'view','inputs':[{'name':'maker','type':'address'},{'name':'app','type':'address'},{'name':'strategyHash','type':'bytes32'},{'name':'token','type':'address'}],'outputs':[{'name':'balance','type':'uint248'},{'name':'tokensCount','type':'uint8'}]},
            {'type':'function','name':'safeBalances','stateMutability':'view','inputs':[{'name':'maker','type':'address'},{'name':'app','type':'address'},{'name':'strategyHash','type':'bytes32'},{'name':'token0','type':'address'},{'name':'token1','type':'address'}],'outputs':[{'name':'balance0','type':'uint256'},{'name':'balance1','type':'uint256'}]},
          ]
          ERC20=[
            {'type':'function','name':'balanceOf','stateMutability':'view','inputs':[{'name':'account','type':'address'}],'outputs':[{'name':'balance','type':'uint256'}]},
          ]
          w3=None
          for rpc in ['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth']:
            try:
              c=Web3(Web3.HTTPProvider(rpc,request_kwargs={'timeout':60})); latest=c.eth.block_number; w3=c; print('RPC|%s|latest=%s' % (rpc,latest)); break
            except Exception as exc: print('RPC_FAIL|%s|%r' % (rpc,exc))
          if w3 is None: raise SystemExit('no rpc')
          aqua=w3.eth.contract(address=Web3.to_checksum_address(AQUA),abi=ABI)
          safe=aqua.functions.safeBalances(Web3.to_checksum_address(TARGET),Web3.to_checksum_address(APP),HexBytes(STRATEGY),Web3.to_checksum_address(TOKENS[0][1]),Web3.to_checksum_address(TOKENS[1][1])).call()
          print('SAFE_BALANCES|1INCH=%s|SPYx=%s' % (Decimal(safe[0])/Decimal(10**18),Decimal(safe[1])/Decimal(10**18)))
          for sym,token,dec in TOKENS:
            raw,count=aqua.functions.rawBalances(Web3.to_checksum_address(TARGET),Web3.to_checksum_address(APP),HexBytes(STRATEGY),Web3.to_checksum_address(token)).call()
            wallet=w3.eth.contract(address=Web3.to_checksum_address(token),abi=ERC20).functions.balanceOf(Web3.to_checksum_address(TARGET)).call()
            print('TOKEN|symbol=%s|virtual=%s|tokens_count=%s|wallet_balance=%s' % (sym,Decimal(raw)/(Decimal(10)**dec),count,Decimal(wallet)/(Decimal(10)**dec)))
          PY
