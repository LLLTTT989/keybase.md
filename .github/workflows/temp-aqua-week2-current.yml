name: Temporary current Aqua rewards

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aqua-week2-current.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Discover active Aqua ships
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'web3>=7,<8' requests
          python3 - <<'PY'
          import json, requests
          from web3 import Web3
          from web3.logs import DISCARD
          from hexbytes import HexBytes
          from decimal import Decimal, getcontext
          from datetime import datetime, timezone, timedelta
          getcontext().prec=90
          TARGET='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          AQUA='0x1111113ccf1426a8e30e2bff5e005d929bf6a90a'
          START='2026-07-27T00:00:00.000000Z'
          ABI=[
            {'type':'function','name':'ship','stateMutability':'nonpayable','inputs':[{'name':'app','type':'address'},{'name':'strategy','type':'bytes'},{'name':'tokens','type':'address[]'},{'name':'amounts','type':'uint256[]'}],'outputs':[{'name':'strategyHash','type':'bytes32'}]},
            {'type':'function','name':'dock','stateMutability':'nonpayable','inputs':[{'name':'app','type':'address'},{'name':'strategyHash','type':'bytes32'},{'name':'tokens','type':'address[]'}],'outputs':[]},
            {'type':'event','name':'Shipped','anonymous':False,'inputs':[{'indexed':False,'name':'maker','type':'address'},{'indexed':False,'name':'app','type':'address'},{'indexed':False,'name':'strategyHash','type':'bytes32'},{'indexed':False,'name':'strategy','type':'bytes'}]},
          ]
          ERC20=[
            {'type':'function','name':'symbol','stateMutability':'view','inputs':[],'outputs':[{'type':'string'}]},
            {'type':'function','name':'decimals','stateMutability':'view','inputs':[],'outputs':[{'type':'uint8'}]},
          ]
          w3=None
          for rpc in ['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth']:
            try:
              c=Web3(Web3.HTTPProvider(rpc,request_kwargs={'timeout':60}));latest=c.eth.block_number;w3=c;print('RPC|%s|latest=%s'%(rpc,latest));break
            except Exception as e:print('RPC_FAIL|%s|%r'%(rpc,e))
          if w3 is None:raise SystemExit('no rpc')
          aqua=w3.eth.contract(address=Web3.to_checksum_address(AQUA),abi=ABI)
          cache={
            '0x111111111117dc0aa78b770fa6a738034120c302':('1INCH',18),
            '0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0':('wstETH',18),
            '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2':('WETH',18),
            '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48':('USDC',6),
            '0xdac17f958d2ee523a2206206994597c13d831ec7':('USDT',6),
            '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599':('WBTC',8),
            '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984':('UNI',18),
          }
          def meta(a):
            a=a.lower()
            if a in cache:return cache[a]
            sym=a[:10];dec=18
            try:
              c=w3.eth.contract(address=Web3.to_checksum_address(a),abi=ERC20);sym=c.functions.symbol().call();dec=int(c.functions.decimals().call())
            except Exception:pass
            cache[a]=(sym,dec);return sym,dec
          def jst(ts):return datetime.fromtimestamp(ts,timezone.utc).astimezone(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S JST')
          s=requests.Session();s.headers.update({'user-agent':'Mozilla/5.0','accept':'application/json'})
          params={};rows=[]
          for page in range(1,100):
            r=s.get(f'https://eth.blockscout.com/api/v2/addresses/{TARGET}/transactions',params=params,timeout=60);r.raise_for_status();d=r.json();items=d.get('items') or []
            if not items:break
            oldest=None
            for x in items:
              stamp=x.get('timestamp');oldest=stamp or oldest
              frm=((x.get('from') or {}).get('hash') or '').lower();to=((x.get('to') or {}).get('hash') or '').lower();method=(x.get('method') or '').lower()
              if frm==TARGET and to==AQUA and method in ('ship','dock') and x.get('hash'):
                rows.append((stamp,method,x['hash']))
            nxt=d.get('next_page_params')
            if not isinstance(nxt,dict) or not nxt:break
            params=nxt
            if oldest and oldest<START:break
          ships=[];docked=set()
          for stamp,method,h in rows:
            tx=w3.eth.get_transaction(h);rc=w3.eth.get_transaction_receipt(h);block=w3.eth.get_block(rc['blockNumber']);ts=int(block['timestamp']);fn,args=aqua.decode_function_input(tx['input'])
            if method=='dock':
              docked.add(('0x'+args['strategyHash'].hex().removeprefix('0x')).lower());continue
            evs=aqua.events.Shipped().process_receipt(rc,errors=DISCARD);sh=None
            for ev in evs:
              if ev['args']['maker'].lower()==TARGET:sh='0x'+ev['args']['strategyHash'].hex().removeprefix('0x');break
            toks=[]
            for t,raw in zip(args['tokens'],args['amounts']):
              a=t.lower();sym,dec=meta(a);toks.append({'address':a,'symbol':sym,'decimals':dec,'amount':str(Decimal(int(raw))/(Decimal(10)**dec)),'raw':str(int(raw))})
            ships.append({'timestamp':ts,'jst':jst(ts),'block':rc['blockNumber'],'tx':h,'app':args['app'].lower(),'strategyHash':sh,'encodedOrder':'0x'+HexBytes(args['strategy']).hex().removeprefix('0x'),'tokens':toks})
          for x in ships:x['active']=x['strategyHash'].lower() not in docked
          active=[x for x in ships if x['active']]
          active.sort(key=lambda x:x['timestamp'])
          print('LIFECYCLE|ships=%s|docks=%s|active=%s'%(len(ships),len(docked),len(active)))
          for x in active:
            print('ACTIVE_SHIP|jst=%s|pair=%s|amounts=%s|hash=%s|tx=%s'%(
              x['jst'],'/'.join(t['symbol'] for t in x['tokens']),','.join('%s=%s'%(t['symbol'],t['amount']) for t in x['tokens']),x['strategyHash'],x['tx']))
          with open('/tmp/aqua_active_ships.json','w') as f:json.dump(active,f)
          PY
      - name: Decode price ranges with official 1inch SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aqua-sdk && cd /tmp/aqua-sdk
          npm init -y >/dev/null 2>&1
          npm install --silent @1inch/swap-vm-sdk decimal.js
          node --input-type=module <<'JS'
          import fs from 'fs'
          import Decimal from 'decimal.js'
          import { Order, HexString, AquaProgramBuilder } from '@1inch/swap-vm-sdk'
          const ships=JSON.parse(fs.readFileSync('/tmp/aqua_active_ships.json','utf8'))
          const out=[]
          const fmt=(d)=>d.toSignificantDigits(18).toString()
          for(const s of ships){
            try{
              const order=Order.decode(new HexString(s.encodedOrder))
              const builder=AquaProgramBuilder.decode(order.program)
              const decoded=[]
              let range=null
              let fee=null
              let protocolFee=null
              let decay=null
              for(const ix of builder.getInstructions()){
                const args=typeof ix.args?.toJSON==='function'?ix.args.toJSON():Object.fromEntries(Object.entries(ix.args||{}).map(([k,v])=>[k,typeof v==='bigint'?v.toString():String(v)]))
                const row={opcode:String(ix.opcode?.id),argsType:ix.args?.constructor?.name,args}
                decoded.push(row)
                if(args?.sqrtPriceMin!==undefined && args?.sqrtPriceMax!==undefined){
                  const spMin=new Decimal(args.sqrtPriceMin);const spMax=new Decimal(args.sqrtPriceMax)
                  const rawMin=spMin.mul(spMin).div('1e18');const rawMax=spMax.mul(spMax).div('1e18')
                  const [lt,gt]=[...s.tokens].sort((a,b)=>BigInt(a.address)<BigInt(b.address)?-1:1)
                  const scale=new Decimal(10).pow(18+Number(gt.decimals)-Number(lt.decimals))
                  const directMin=rawMin.div(scale);const directMax=rawMax.div(scale)
                  range={
                    sqrtPriceMin:String(args.sqrtPriceMin),sqrtPriceMax:String(args.sqrtPriceMax),
                    rawPriceMin:rawMin.toFixed(0),rawPriceMax:rawMax.toFixed(0),
                    directPair:`${gt.symbol} per ${lt.symbol}`,directMin:fmt(directMin),directMax:fmt(directMax),
                    inversePair:`${lt.symbol} per ${gt.symbol}`,inverseMin:fmt(new Decimal(1).div(directMax)),inverseMax:fmt(new Decimal(1).div(directMin)),
                  }
                }
                if(row.argsType==='FlatFeeArgs') fee=args
                if(row.argsType==='ProtocolFeeArgs') protocolFee=args
                if(row.argsType==='DecayXDArgs') decay=args
              }
              const item={...s,maker:order.maker.toString(),traits:order.traits?.toJSON?.()||null,range,fee,protocolFee,decay,instructions:decoded}
              out.push(item)
              console.log('DECODED|jst=%s|pair=%s|active=%s|hash=%s|range=%s|fee=%s|protocol_fee=%s|decay=%s|instructions=%s',s.jst,s.tokens.map(t=>t.symbol).join('/'),s.active,s.strategyHash,JSON.stringify(range),JSON.stringify(fee),JSON.stringify(protocolFee),JSON.stringify(decay),JSON.stringify(decoded))
            }catch(e){
              console.log('DECODE_FAIL|jst=%s|hash=%s|error=%s',s.jst,s.strategyHash,e?.stack||String(e))
            }
          }
          const latestByPair=new Map()
          for(const x of out)latestByPair.set(x.tokens.map(t=>t.symbol).sort().join('/'),x)
          console.log('LATEST_BY_PAIR_COUNT|'+latestByPair.size)
          for(const [pair,x] of [...latestByPair.entries()].sort())console.log('LATEST_BY_PAIR|pair=%s|jst=%s|amounts=%s|hash=%s|range=%s|fee=%s|protocol_fee=%s|decay=%s',pair,x.jst,x.tokens.map(t=>`${t.symbol}=${t.amount}`).join(','),x.strategyHash,JSON.stringify(x.range),JSON.stringify(x.fee),JSON.stringify(x.protocolFee),JSON.stringify(x.decay))
          fs.writeFileSync('/tmp/aqua_decoded_ranges.json',JSON.stringify(out,null,2))
          JS
