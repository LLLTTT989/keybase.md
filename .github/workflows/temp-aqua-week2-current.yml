name: Temporary current Aqua rewards

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aqua-week2-current.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Merkl and decode claims
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'web3>=7,<8' requests
          python3 - <<'PY'
          import requests
          from web3 import Web3
          from hexbytes import HexBytes
          from decimal import Decimal, getcontext
          from datetime import datetime, timezone, timedelta
          getcontext().prec=90
          T='0xe01ecff2f6c4f2416e83e6861e8abf79b1c95950'
          D='0x3ef3d8ba38ebe18db133cec108f4d14ce00dd9ae'
          OLD={'1INCH':Decimal('77283.464986563401351269'),'USDC':Decimal('7728.346495')}
          META={
            '0x111111111117dc0aa78b770fa6a738034120c302':('1INCH',18),
            '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48':('USDC',6),
            '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984':('UNI',18),
          }
          s=requests.Session();s.headers.update({'user-agent':'Mozilla/5.0','accept':'application/json'})
          now=datetime.now(timezone.utc)
          print('SNAPSHOT|utc=%s|jst=%s'%(now.isoformat(),now.astimezone(timezone(timedelta(hours=9))).isoformat()))
          u=f'https://api.merkl.xyz/v4/users/{T}/rewards?chainId=1&reloadChainId=1'
          r=s.get(u,timeout=60);print('MERKL_HTTP|%s'%r.status_code);r.raise_for_status();data=r.json()
          current={}; opps=set()
          for chain in data:
            for rew in chain.get('rewards') or []:
              tok=rew.get('token') or {};sym=str(tok.get('symbol'));dec=int(tok.get('decimals') or 18);scale=Decimal(10)**dec
              amount=Decimal(str(rew.get('amount') or 0))/scale;claimed=Decimal(str(rew.get('claimed') or 0))/scale;pending=Decimal(str(rew.get('pending') or 0))/scale
              current[sym]=(amount,claimed,pending,tok.get('price'))
              print('REWARD|symbol=%s|amount=%s|claimed=%s|claimable=%s|pending=%s|price=%s'%(sym,amount,claimed,amount-claimed,pending,tok.get('price')))
              if sym in ('1INCH','USDC'):
                for b in rew.get('breakdowns') or []:
                  opps.add(str(b.get('opportunityId')))
                  print('BREAKDOWN|symbol=%s|opp=%s|campaign=%s|amount=%s|claimed=%s|pending=%s|root=%s|reason=%s'%(
                    sym,b.get('opportunityId'),b.get('campaignId'),Decimal(str(b.get('amount') or 0))/scale,Decimal(str(b.get('claimed') or 0))/scale,Decimal(str(b.get('pending') or 0))/scale,b.get('root'),b.get('reason')))
          for sym,old in OLD.items():
            amount,claimed,pending,_=current.get(sym,(Decimal(0),Decimal(0),Decimal(0),None))
            print('DELTA|symbol=%s|old=%s|amount=%s|credited_delta=%s|claimed=%s|claimed_delta=%s|pending=%s'%(sym,old,amount,amount-old,claimed,claimed-old,pending))
          for oid in sorted(opps):
            try:
              q=s.get('https://api.merkl.xyz/v4/opportunities/'+oid,timeout=45);o=q.json() if q.ok else {}
              print('OPP|id=%s|name=%s|chain=%s|status=%s'%(oid,o.get('name'),(o.get('chain') or {}).get('name'),o.get('status')))
            except Exception as e: print('OPP_FAIL|id=%s|error=%r'%(oid,e))
          # Find all direct claim calls since campaign launch.
          params={}; hashes=[];seen=set();url=f'https://eth.blockscout.com/api/v2/addresses/{T}/transactions'
          for page in range(1,60):
            q=s.get(url,params=params,timeout=60);q.raise_for_status();j=q.json();items=j.get('items') or []
            if not items:break
            oldest=None
            for x in items:
              stamp=x.get('timestamp');oldest=stamp or oldest
              frm=((x.get('from') or {}).get('hash') or '').lower();to=((x.get('to') or {}).get('hash') or '').lower();method=(x.get('method') or '').lower()
              if frm==T and to==D and method=='claim' and x.get('hash') not in seen:
                seen.add(x.get('hash'));hashes.append(x.get('hash'));print('CLAIM_CALL|timestamp=%s|hash=%s|status=%s'%(stamp,x.get('hash'),x.get('status')))
            nxt=j.get('next_page_params')
            if not isinstance(nxt,dict) or not nxt:break
            params=nxt
            if oldest and oldest<'2026-07-27':break
          w3=None
          for rpc in ['https://ethereum-rpc.publicnode.com','https://eth.llamarpc.com','https://1rpc.io/eth']:
            try:
              c=Web3(Web3.HTTPProvider(rpc,request_kwargs={'timeout':60}));_=c.eth.block_number;w3=c;print('RPC|%s|latest=%s'%(rpc,c.eth.block_number));break
            except Exception as e:print('RPC_FAIL|%s|%r'%(rpc,e))
          if w3 is None:raise SystemExit('no rpc')
          topic=Web3.keccak(text='Transfer(address,address,uint256)').hex();grand={}
          for h in sorted(hashes,key=lambda z:w3.eth.get_transaction_receipt(z)['blockNumber']):
            rc=w3.eth.get_transaction_receipt(h);bl=w3.eth.get_block(rc['blockNumber']);ts=int(bl['timestamp']);utc=datetime.fromtimestamp(ts,timezone.utc);jst=utc.astimezone(timezone(timedelta(hours=9)));sums={}
            for log in rc['logs']:
              tp=log['topics']
              if len(tp)!=3 or tp[0].hex()!=topic:continue
              frm='0x'+tp[1].hex()[-40:];to='0x'+tp[2].hex()[-40:]
              if frm.lower()!=D or to.lower()!=T:continue
              token=log['address'].lower();sym,dec=META.get(token,(token[:10],18));raw=int.from_bytes(HexBytes(log['data']),'big');amt=Decimal(raw)/(Decimal(10)**dec);sums[sym]=sums.get(sym,Decimal(0))+amt;grand[sym]=grand.get(sym,Decimal(0))+amt
            print('CLAIM_TX|jst=%s|utc=%s|block=%s|hash=%s|tokens=%s'%(jst.strftime('%Y-%m-%d %H:%M:%S JST'),utc.isoformat(),rc['blockNumber'],h,','.join('%s=%s'%x for x in sorted(sums.items())) or 'none'))
          for sym,total in sorted(grand.items()):print('CLAIM_TOTAL|symbol=%s|amount=%s'%(sym,total))
          PY
